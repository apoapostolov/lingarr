name: Issue Template Validation

on:
  issues:
    types: [opened]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.issue.number;
            const body = context.payload.issue.body || '';

            const tags = await github.paginate(github.rest.repos.listTags, {
              owner,
              repo,
              per_page: 100,
            });
            const allowedVersions = new Set(tags.map(t => t.name.replace(/^v/, '').toLowerCase()));

            const versionMatch = body.match(/###\s*Lingarr version\s*\r?\n+([^\r\n]+)/i);
            const versionValue = versionMatch ? versionMatch[1].trim().replace(/^v/, '').toLowerCase() : '';
            const hasVersion = allowedVersions.has(versionValue);

            if (hasVersion) return;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: 'Closing this issue because the submitted version does not match a published Lingarr Next release. Please update to or select a released version and submit the report again.',
            });

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: ['invalid'],
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'not_planned',
            });
